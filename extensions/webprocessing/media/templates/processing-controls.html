<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		html, body {
			margin: 0;
			padding: 0;
			background: transparent;
			color: var(--vscode-foreground);
			font-family: var(--vscode-font-family);
			font-size: var(--vscode-font-size);
		}
		.controls {
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			gap: 6px;
			padding: 8px 12px 10px;
		}
			button {
				box-sizing: border-box;
				width: 100%;
			min-height: 28px;
			border: 1px solid var(--vscode-button-border, transparent);
			border-radius: 2px;
			padding: 4px 10px;
			background: var(--vscode-button-background);
			color: var(--vscode-button-foreground);
			font: inherit;
			text-align: center;
				cursor: pointer;
			}
			select {
				box-sizing: border-box;
				width: 100%;
				min-height: 26px;
				border: 1px solid var(--vscode-dropdown-border);
				border-radius: 2px;
				padding: 3px 8px;
				background: var(--vscode-dropdown-background);
				color: var(--vscode-dropdown-foreground);
				font: inherit;
			}
		button:hover:not(:disabled) {
			background: var(--vscode-button-hoverBackground);
		}
		button:focus-visible {
			outline: 1px solid var(--vscode-focusBorder);
			outline-offset: 2px;
		}
		button.secondary {
			background: var(--vscode-button-secondaryBackground);
			color: var(--vscode-button-secondaryForeground);
		}
		button.secondary:hover:not(:disabled) {
			background: var(--vscode-button-secondaryHoverBackground);
		}
		button:disabled {
			opacity: 0.45;
			cursor: default;
		}
		.status, .warning {
			margin-top: 4px;
			color: var(--vscode-descriptionForeground);
			font-size: 11px;
			line-height: 1.35;
		}
		.warning {
			color: var(--vscode-editorWarning-foreground);
		}
	</style>
</head>
	<body>
		<div class="controls">
			<select id="mode" aria-label="Mode">
				<option value="processing">Processing</option>
				<option value="java">Java</option>
			</select>
			<button id="compile" type="button">Compile</button>
			<button id="run" type="button">Run</button>
		<button id="stop" class="secondary" type="button">Stop</button>
		<div id="status" class="status"></div>
		<div id="warning" class="warning"></div>
	</div>
	<script nonce="{{nonce}}">
		const vscode = acquireVsCodeApi();
		const state = JSON.parse("{{initialState}}");
			const buttons = {
				compile: document.getElementById('compile'),
				run: document.getElementById('run'),
				stop: document.getElementById('stop')
			};
			const mode = document.getElementById('mode');
			const status = document.getElementById('status');
			const warning = document.getElementById('warning');
			function applyState(next) {
				Object.assign(state, next);
				mode.value = state.mode || 'processing';
				mode.disabled = state.isCompiling || state.isRunning;
				buttons.compile.disabled = !state.hasSources || state.isCompiling || state.isRunning;
				buttons.run.disabled = !state.hasSources || !state.hasCompiled || state.isCompiling || state.isRunning;
				buttons.stop.disabled = !state.isRunning;
				status.textContent = state.status || '';
			warning.textContent = state.warning || '';
			warning.hidden = !state.warning;
		}
			buttons.compile.addEventListener('click', () => vscode.postMessage({ type: 'compile' }));
			buttons.run.addEventListener('click', () => vscode.postMessage({ type: 'run' }));
			buttons.stop.addEventListener('click', () => vscode.postMessage({ type: 'stop' }));
			mode.addEventListener('change', () => vscode.postMessage({ type: 'mode', mode: mode.value }));
		window.addEventListener('message', event => {
			if (event.data?.type === 'state') {
				applyState(event.data.state);
			}
		});
		applyState(state);
	</script>
</body>
</html>
