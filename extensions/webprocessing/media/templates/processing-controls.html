<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			background: transparent;
			color: var(--vscode-foreground);
			font-family: var(--vscode-font-family);
			font-size: var(--vscode-font-size);
		}
		.controls {
			box-sizing: border-box;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			gap: 6px;
			padding: 8px 12px 10px;
		}
		.references {
			display: flex;
			flex-direction: column;
			gap: 6px;
			margin-top: auto;
			padding-top: 8px;
		}
			button {
				box-sizing: border-box;
				width: 100%;
			min-height: 28px;
			border: 1px solid var(--vscode-button-border, transparent);
			border-radius: 2px;
			padding: 4px 10px;
			background: var(--vscode-button-background);
			color: var(--vscode-button-foreground);
			font: inherit;
			text-align: center;
				cursor: pointer;
			}
			select {
				box-sizing: border-box;
				width: 100%;
				min-height: 26px;
				border: 1px solid var(--vscode-dropdown-border);
				border-radius: 2px;
				padding: 3px 8px;
				background: var(--vscode-dropdown-background);
				color: var(--vscode-dropdown-foreground);
				font: inherit;
			}
		button:hover:not(:disabled) {
			background: var(--vscode-button-hoverBackground);
		}
		button:focus-visible {
			outline: 1px solid var(--vscode-focusBorder);
			outline-offset: 2px;
		}
		button.secondary {
			background: var(--vscode-button-secondaryBackground);
			color: var(--vscode-button-secondaryForeground);
		}
		button.secondary:hover:not(:disabled) {
			background: var(--vscode-button-secondaryHoverBackground);
		}
		button:disabled {
			opacity: 0.45;
			cursor: default;
		}
		.status, .warning {
			margin-top: 4px;
			color: var(--vscode-descriptionForeground);
			font-size: 11px;
			line-height: 1.35;
		}
		.warning {
			color: var(--vscode-editorWarning-foreground);
		}
	</style>
</head>
	<body>
		<div class="controls">
			<select id="mode" aria-label="Mode">
				<option value="processing">Processing</option>
				<option value="java">Java</option>
			</select>
			<select id="processingOutput" aria-label="Processing output">
				<option value="auto">Auto</option>
				<option value="wasm-gc">Wasm-GC</option>
				<option value="js">JavaScript</option>
			</select>
			<button id="compile" type="button">Compile</button>
			<button id="run" type="button">Run</button>
			<button id="exportWebsite" type="button">Export Website</button>
			<button id="stop" class="secondary" type="button">Stop</button>
		<div id="status" class="status"></div>
		<div id="warning" class="warning"></div>
		<div class="references">
			<button id="processingReference" class="secondary" type="button">Open Processing Reference</button>
			<button id="apcsaReference" class="secondary" type="button">Open APCSA Reference</button>
		</div>
	</div>
	<script nonce="{{nonce}}">
		const vscode = acquireVsCodeApi();
		const state = JSON.parse("{{initialState}}");
			const buttons = {
				compile: document.getElementById('compile'),
				run: document.getElementById('run'),
				exportWebsite: document.getElementById('exportWebsite'),
				stop: document.getElementById('stop'),
				processingReference: document.getElementById('processingReference'),
				apcsaReference: document.getElementById('apcsaReference')
			};
			const mode = document.getElementById('mode');
			const processingOutput = document.getElementById('processingOutput');
			const status = document.getElementById('status');
			const warning = document.getElementById('warning');
			function setDisabled(element, disabled) {
				if (element) {
					element.disabled = disabled;
				}
			}
			function setText(element, text) {
				if (element) {
					element.textContent = text;
				}
			}
			function onClick(element, callback) {
				if (element) {
					element.addEventListener('click', callback);
				}
			}
			function applyState(next) {
				Object.assign(state, next);
				if (mode) {
					mode.value = state.mode || 'processing';
					mode.disabled = state.isCompiling || state.isRunning;
				}
				if (processingOutput) {
					processingOutput.value = state.processingOutput || 'auto';
					processingOutput.disabled = state.mode !== 'processing' || state.isCompiling || state.isRunning;
				}
				setDisabled(buttons.compile, !state.hasSources || state.isCompiling || state.isRunning);
				setDisabled(buttons.run, !state.hasSources || !state.hasCompiled || state.isCompiling || state.isRunning);
				setDisabled(buttons.exportWebsite, state.mode !== 'processing' || !state.hasSources || state.isCompiling || state.isRunning);
				setDisabled(buttons.stop, !state.isRunning);
				setText(status, state.status || '');
				setText(warning, state.warning || '');
				if (warning) {
					warning.hidden = !state.warning;
				}
		}
			onClick(buttons.compile, () => vscode.postMessage({ type: 'compile' }));
			onClick(buttons.run, () => vscode.postMessage({ type: 'run' }));
			onClick(buttons.exportWebsite, () => vscode.postMessage({ type: 'exportWebsite' }));
			onClick(buttons.stop, () => vscode.postMessage({ type: 'stop' }));
			onClick(buttons.processingReference, () => vscode.postMessage({ type: 'openReference' }));
			onClick(buttons.apcsaReference, () => vscode.postMessage({ type: 'openApcsaReference' }));
			if (mode) {
				mode.addEventListener('change', () => vscode.postMessage({ type: 'mode', mode: mode.value }));
			}
			if (processingOutput) {
				processingOutput.addEventListener('change', () => vscode.postMessage({ type: 'processingOutput', output: processingOutput.value }));
			}
		window.addEventListener('message', event => {
			if (event.data?.type === 'state') {
				applyState(event.data.state);
			}
		});
		applyState(state);
	</script>
</body>
</html>
