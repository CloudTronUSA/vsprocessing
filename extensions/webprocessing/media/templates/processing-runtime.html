<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}' 'unsafe-eval' 'wasm-unsafe-eval' blob: {{cspSource}}; connect-src {{cspSource}};">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		html, body { height: 100%; margin: 0; overflow: hidden; background: var(--vscode-editor-background); color: var(--vscode-foreground); font-family: var(--vscode-font-family); }
		#root { height: 100%; display: grid; grid-template-rows: 1fr auto; }
		#sketch { min-height: 0; display: grid; place-items: center; overflow: hidden; }
		#status { border-top: 1px solid var(--vscode-panel-border); padding: 6px 8px; color: var(--vscode-descriptionForeground); font-size: 12px; }
		canvas { display: block; outline: 1px solid var(--vscode-panel-border); }
	</style>
</head>
<body>
	<div id="root">
		<div id="sketch"></div>
		<div id="status">Loading...</div>
	</div>
	<script nonce="{{nonce}}">
		const vscode = acquireVsCodeApi();
		const payload = JSON.parse("{{payload}}");
		const sketch = document.getElementById('sketch');
		const status = document.getElementById('status');

		// this is some sick shit
		// the run function is async. it will try to start the run after fetching even if the user pressed Stop or closed the panel.
		// so to address this, we capture the current generation when run is called.
		// when we stop, we increment the generation.
		// when the fetches complete and we're about to start, we check if the generation is still the same.
		// if not, we know the user has stopped or restarted the sketch, so we abort starting.
		let generation = 0;

		let p5Instance;
		let program;
		let sketchInstance;
		let canvasObserver;
		let resolveWasmBytes;
		let resolveJsText;
		let fileRequestId = 0;
		const fileRequests = new Map();

		const wasmBytesFromHost = new Promise(resolve => {
			resolveWasmBytes = resolve;
		});
		const jsTextFromHost = new Promise(resolve => {
			resolveJsText = resolve;
		});

		const send = message => vscode.postMessage(message);

		// error handling stuff
		const convToString = value => {
			if (typeof value === 'string') return value;
			try { return JSON.stringify(value); } catch { return String(value); }
		};
		const formatError = value => {	// turn errors into nice V8 style
			if (!(value instanceof Error) || !value.stack) {
				return convToString(value);
			}

			const header = value.name + ': ' + value.message;
			const stack = String(value.stack);
			return stack.startsWith(value.name) || stack.startsWith(header)
				? stack	// this is a V8 error, stack already looks good
				: header + '\n' + stack.split('\n').map(line => line ? '    ' + line : line).join('\n');	// gross firefox/safari
		};
		const formatConsoleLog = value => {
			if (value instanceof Error) return formatError(value);
			return convToString(value);
		};

		// SAFARI IS THE BIGGEST GARBAGE IN THE WORLD
		// if i dont catch the error and throw it myself
		// safari thinks my code is not trusted and does not let me see error details
		var isSafari = navigator.vendor && navigator.vendor.indexOf('Apple') > -1 &&
                navigator.userAgent &&
                navigator.userAgent.indexOf('CriOS') == -1 &&
                navigator.userAgent.indexOf('FxiOS') == -1;
  	    if (isSafari) {
			const originalRequestAnimationFrame = window.requestAnimationFrame.bind(window);
			window.requestAnimationFrame = callback => originalRequestAnimationFrame(time => {
				try {
					callback(time);
				} catch (error) {
					throw error;
				}
			});
		}

		// binds to console logs. this is where stuff like system.out.println() in processing ends up
		for (const level of ['log', 'info', 'debug', 'warn', 'error']) {
			const original = console[level].bind(console);
			console[level] = (...values) => {
				send({ type: 'log-raw', text: values.map(formatConsoleLog).join(' ') });
				original(...values);
			};
		}

		// now finally bind to error events
		window.onerror = (message, source, line, column, error) => {
			send({ type: 'log-raw', text: formatError(error) });
		};
		window.onunhandledrejection = event => {
			send({ type: 'log-raw', text: formatError(event.reason) });
		};

		// handle messages from the host
		window.addEventListener('message', event => {
			if (event.data?.type === 'stop') {
				stop();
			} else if (event.data?.type === 'wasmBytes') {
				resolveWasmBytes(new Uint8Array(event.data.bytes));
			} else if (event.data?.type === 'jsText') {
				resolveJsText(event.data.text || '');
			} else if (event.data?.type === 'fileResponse') {
				const request = fileRequests.get(event.data.id);
				if (request) {
					fileRequests.delete(event.data.id);
					if (event.data.ok) {
						request.resolve(new Response(event.data.bytes || new ArrayBuffer(0), {
							status: 200,
							headers: { 'Content-Type': event.data.mime || 'application/octet-stream' }
						}));
					} else {
						request.resolve(new Response(event.data.error || 'Not Found', { status: 404 }));
					}
				}
			}
		});

		const originalFetch = window.fetch.bind(window);
		window.fetch = (input, init) => {
			const runtimePath = getRuntimeFilePath(input);
			return runtimePath ? fetchRuntimeFile(runtimePath) : originalFetch(input, init);
		};

		// set up other stuff, notify ready
		window.addEventListener('resize', fitCanvas);
		send({ type: 'readyForArtifact' });

		function getRuntimeFilePath(input) {
			const value = typeof input === 'string' ? input : input?.url;
			if (!value || value.startsWith('blob:') || value.startsWith('data:')) {
				return '';
			}
			try {
				const url = new URL(value, location.href);
				if (url.origin !== location.origin) {
					return '';
				}
				const marker = '/pre/';
				const markerIndex = url.pathname.indexOf(marker);
				if (markerIndex >= 0) {
					return decodeURIComponent(url.pathname.slice(markerIndex + marker.length));
				}
				return value.includes(':') || value.startsWith('/') ? '' : value;
			} catch {
				return value.includes(':') || value.startsWith('/') ? '' : value;
			}
		}

		function fetchRuntimeFile(path) {
			const id = ++fileRequestId;
			send({ type: 'fileRequest', id, path });
			return new Promise((resolve, reject) => {
				fileRequests.set(id, { resolve, reject });
			});
		}

		function stop() {
			generation++;
			clearRuntime();
			status.textContent = 'Stopped.';
			send({ type: 'stopped' });
		}

		function clearRuntime() {
			try {
				sketchInstance?.dispose?.();
				sketchInstance?.destroy?.();
				sketchInstance?.stop?.();
				p5Instance?.remove?.();
			} catch (error) {
				console.warn(error);
			}
			sketchInstance = undefined;
			p5Instance = undefined;
			program = undefined;
			canvasObserver?.disconnect();
			canvasObserver = undefined;
			sketch.replaceChildren();
		}

		function fitCanvas() {
			const canvas = sketch.querySelector('canvas');
			if (!canvas) {
				return;
			}
			const sourceWidth = canvas.width || canvas.clientWidth;
			const sourceHeight = canvas.height || canvas.clientHeight;
			const targetWidth = sketch.clientWidth;
			const targetHeight = sketch.clientHeight;
			if (!sourceWidth || !sourceHeight || !targetWidth || !targetHeight) {
				return;
			}
			const scale = Math.min(targetWidth / sourceWidth, targetHeight / sourceHeight);
			canvas.style.width = Math.max(1, Math.floor(sourceWidth * scale)) + 'px';
			canvas.style.height = Math.max(1, Math.floor(sourceHeight * scale)) + 'px';
		}

		// watch for canvas size changes too, not just the panel
		function watchCanvasSize() {
			canvasObserver?.disconnect();
			canvasObserver = new MutationObserver(() => fitCanvas());
			canvasObserver.observe(sketch, { childList: true, subtree: true, attributes: true, attributeFilter: ['width', 'height', 'style'] });
			fitCanvas();
			requestAnimationFrame(fitCanvas);
		}

		async function run() {
			stop();
			const current = ++generation;
			status.textContent = 'Starting...';

			// fetch files
			const [runtimeModule, processingModule, artifactResponse] = await Promise.all([
				payload.output === 'wasm-gc' ? import(payload.wasmRuntimeUri) : Promise.resolve(undefined),
				payload.output === 'wasm-gc' ? import(payload.processingUri) : Promise.resolve(undefined),
				payload.output === 'wasm-gc' && payload.artifactUri ? fetch(payload.artifactUri) : Promise.resolve(undefined)
			]);
			if (payload.output === 'js') {
				await loadP5();
			}
			if (current !== generation) return;
			if (artifactResponse && !artifactResponse.ok) {
				throw new Error('Failed to load compiled WebAssembly: HTTP ' + artifactResponse.status);
			}

			if (payload.output === 'wasm-gc') {
				await runWasmSketch(runtimeModule, processingModule, artifactResponse);
				return;
			}

			const start = (await importJsSketch()).start;
			if (typeof start !== 'function') {
				throw new Error('Compiled Processing sketch did not export start.');
			}

			await new Promise((resolve, reject) => {
				p5Instance = new window.p5(p => {
					p.setup = () => {
						try {
							sketchInstance = start(p);
							watchCanvasSize();
							status.textContent = 'Running...';
							send({ type: 'log-raw', text: '[runtime] Render backend used: p5' });
							send({ type: 'started' });
							resolve();
						} catch (error) {
							reject(error);
						}
					};
				}, sketch);
			});
		}

		async function runWasmSketch(runtimeModule, processingModule, wasmResponse) {
			const wasmBytes = wasmResponse ? new Uint8Array(await wasmResponse.arrayBuffer()) : await wasmBytesFromHost;
			program = await processingModule.createProcessingProgram(wasmBytes, {
				runtimeModule,
				stdio: {
					stdin: '',
					stdout: text => send({ type: 'stdout', text }),
					stderr: text => send({ type: 'stderr', text })
				}
			});
			const canvasBackend = processingModule.createCanvas2DBackend(sketch, {});
			sketchInstance = program.execute({ canvasBackend });
			watchCanvasSize();
			status.textContent = 'Running...';
			send({ type: 'started' });
		}

		async function loadP5() {
			if (typeof window.p5 === 'function') {
				return;
			}
			await new Promise((resolve, reject) => {
				const script = document.createElement('script');
				script.src = payload.p5Uri;
				script.onload = resolve;
				script.onerror = () => reject(new Error('Failed to load p5.js.'));
				document.head.appendChild(script);
			});
		}

		async function importJsSketch() {
			if (payload.artifactUri) {
				return import(payload.artifactUri);
			}
			const moduleUrl = URL.createObjectURL(new Blob([await jsTextFromHost], { type: 'text/javascript' }));
			try {
				return await import(moduleUrl);
			} finally {
				URL.revokeObjectURL(moduleUrl);
			}
		}
		run().catch(error => {	// this is for any error that occurs BEFORE processing actually runs
			status.textContent = 'Starting failed.';
			send({ type: 'log-raw', text: formatError(error) });
			send({ type: 'stopped' });
		});
	</script>
</body>
</html>
